name: Deploy Vercel (manual)

# Deploy bajo demanda. El deploy automático en push/PR vive en ci-and-deploy.yml.
# Evita doble deploy en cada push.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: production o preview
        required: true
        default: production
        type: choice
        options:
          - production
          - preview

concurrency:
  group: vercel-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Manual Vercel deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Require secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "::error::Configura VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID"
            exit 1
          fi

      - run: npm ci
      - run: npm install --global vercel@latest

      - name: Pull / build / deploy
        run: |
          ENV_NAME="${{ inputs.environment }}"
          vercel pull --yes --environment="$ENV_NAME" --token="${{ secrets.VERCEL_TOKEN }}"
          if [ "$ENV_NAME" = "production" ]; then
            vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
            vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
          else
            vercel build --token="${{ secrets.VERCEL_TOKEN }}"
            vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}"
          fi
