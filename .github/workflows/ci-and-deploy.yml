name: CI and Deploy

# Quality en push/PR a master, Core2 y Core3.
# Deploy Vercel solo en push a master (Core2/Core3 no despliegan producción).

on:
  push:
    branches: [master, Core2, Core3]
  pull_request:
    branches: [master, Core2, Core3]
  workflow_dispatch:

concurrency:
  group: ci-deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
        env:
          VITE_APPWRITE_ENDPOINT: https://cloud.appwrite.io/v1
          VITE_APPWRITE_PROJECT_ID: ci-placeholder
          VITE_APPWRITE_DATABASE_ID: ci-placeholder

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dash-dist-${{ github.sha }}
          path: dist
          retention-days: 5

  deploy:
    name: Deploy Vercel
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Solo producción desde master; Core2/Core3 corren quality pero no deploy.
    if: needs.quality.result == 'success' && github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check Vercel secrets
        id: vercel_secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets VERCEL_* no configurados. Quality gate OK; deploy omitido."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.vercel_secrets.outputs.configured == 'true'

      - uses: actions/setup-node@v4
        if: steps.vercel_secrets.outputs.configured == 'true'
        with:
          node-version: "22"
          cache: npm

      - name: Install
        if: steps.vercel_secrets.outputs.configured == 'true'
        run: npm ci

      - name: Install Vercel CLI
        if: steps.vercel_secrets.outputs.configured == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel env
        if: steps.vercel_secrets.outputs.configured == 'true'
        run: vercel pull --yes --environment=${{ github.event_name == 'pull_request' && 'preview' || 'production' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build on Vercel
        if: steps.vercel_secrets.outputs.configured == 'true'
        run: vercel build ${{ github.event_name != 'pull_request' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        if: steps.vercel_secrets.outputs.configured == 'true'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          else
            url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

      - name: Comment PR preview
        if: |
          steps.vercel_secrets.outputs.configured == 'true' &&
          github.event_name == 'pull_request' &&
          steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const body = `### Vercel Preview\n\n${url}\n\n_Quality gate PASS → deploy automático_`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes('Vercel Preview'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
