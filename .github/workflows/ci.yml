name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Check · Unit tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (svelte-check + tsc)
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build
        env:
          # Placeholders para que Vite empaquete sin secretos reales en CI.
          # El deploy inyecta las VITE_* reales vía Vercel project env.
          VITE_APPWRITE_ENDPOINT: https://cloud.appwrite.io/v1
          VITE_APPWRITE_PROJECT_ID: ci-placeholder
          VITE_APPWRITE_DATABASE_ID: ci-placeholder

      - name: Upload dist artifact
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: dash-dist
          path: dist
          retention-days: 7
